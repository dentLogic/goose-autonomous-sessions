# .github/workflows/ci.yml
# Runs the test suite + typecheck on every push/PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install || true

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run standalone demo (smoke test)
        run: bun examples/standalone-demo.ts

  patch-validation:
    name: Patch validation against pinned Goose commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone Goose at the pinned commit
        env:
          PINNED: ${{ secrets.GOOSE_PINNED_COMMIT || 'ce0c4900837a51b2ae50ce0df1484c34a1be754e' }}
        run: |
          git clone --depth 1 https://github.com/aaif-goose/goose.git /tmp/goose
          cd /tmp/goose
          git fetch --depth 1 origin $PINNED
          git checkout $PINNED

      - name: Validate patches
        run: ./patches/validate.sh /tmp/goose
